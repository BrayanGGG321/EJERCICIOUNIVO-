      --bg: #F4F7FA;

      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);

    * {

      margin: 0;

    header {

    }

      font-weight: 700;
      letter-spacing: 0.06em;

      font-size: 0.78rem;
      margin-bottom: 0.2rem;
