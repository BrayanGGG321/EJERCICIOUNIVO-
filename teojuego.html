<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad: La Caja Fuerte</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* Contenedor principal con perspectiva 3D */
        .safe-container {
            position: relative;
            width: 350px;
            height: 450px;
            perspective: 1000px; /* Para el efecto 3D de la puerta */
        }

        /* El interior de la caja (lo que se ve al abrir) */
        .safe-interior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #f1c40f 20%, #b7950b 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px #000;
            z-index: 1;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .safe-interior h2 {
            color: #5d4037;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .safe-interior p {
            color: #333;
            font-weight: bold;
        }

        /* La Puerta de la Caja */
        .safe-door {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #95a5a6;
            background-image: linear-gradient(45deg, #7f8c8d 25%, transparent 25%, transparent 75%, #7f8c8d 75%, #7f8c8d), 
                              linear-gradient(45deg, #7f8c8d 25%, transparent 25%, transparent 75%, #7f8c8d 75%, #7f8c8d);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border-radius: 20px;
            border: 10px solid #555;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transform-origin: left center; /* La bisagra está a la izquierda */
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Clase para abrir la puerta */
        .safe-door.open {
            transform: rotateY(-110deg);
        }

        /* Pantalla digital */
        .display {
            background-color: #222;
            color: #e74c3c; /* Rojo LED por defecto */
            font-family: 'Courier New', monospace;
            font-size: 2em;
            width: 80%;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 4px solid #444;
            border-radius: 5px;
            letter-spacing: 5px;
            box-shadow: inset 0 0 10px #000;
            text-shadow: 0 0 5px #c0392b;
            min-height: 30px;
        }
        
        .display.success {
            color: #2ecc71;
            text-shadow: 0 0 5px #27ae60;
        }

        /* Teclado numérico */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #bdc3c7;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #7f8c8d;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 4px #2c3e50;
            transition: all 0.1s;
        }

        .btn:active {
            box-shadow: 0 0 #2c3e50;
            transform: translateY(4px);
        }

        .btn-enter {
            background: #27ae60;
        }
        
        .btn-clear {
            background: #c0392b;
        }

        /* Manija de la puerta */
        .handle {
            width: 20px;
            height: 100px;
            background: linear-gradient(to bottom, #7f8c8d, #fff, #7f8c8d);
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

    </style>
</head>
<body>

    <div class="safe-container">
        <div class="safe-interior">
            <h2>¡EXCELENTE!</h2>
            <p>Has desbloqueado el siguiente nivel.</p>
            <div style="font-size: 40px;">💎📚🏆</div>
            <p style="margin-top:20px; font-size: 0.8em;">Premio desbloqueado:<br>Podrás elegir un sobre.</p>
        </div>

        <div class="safe-door" id="safeDoor">
            <div class="handle"></div>

            <div class="display" id="display">----</div>

            <div class="keypad">
                <button class="btn" onclick="addNumber(1)">1</button>
                <button class="btn" onclick="addNumber(2)">2</button>
                <button class="btn" onclick="addNumber(3)">3</button>
                <button class="btn" onclick="addNumber(4)">4</button>
                <button class="btn" onclick="addNumber(5)">5</button>
                <button class="btn" onclick="addNumber(6)">6</button>
                <button class="btn" onclick="addNumber(7)">7</button>
                <button class="btn" onclick="addNumber(8)">8</button>
                <button class="btn" onclick="addNumber(9)">9</button>
                <button class="btn btn-clear" onclick="clearDisplay()">C</button>
                <button class="btn" onclick="addNumber(0)">0</button>
                <button class="btn btn-enter" onclick="checkCode()">🔓</button>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_CODE = "502565711668"; // <--- AQUÍ CONFIGURAS LA CONTRASEÑA
        let currentInput = "";
        const displayElement = document.getElementById('display');
        const doorElement = document.getElementById('safeDoor');

        // Función para agregar números
        function addNumber(num) {
            if (currentInput.length < 12) { // Limita a 4 dígitos
                currentInput += num;
                updateDisplay();
            }
        }

        // Función para limpiar
        function clearDisplay() {
            currentInput = "";
            displayElement.classList.remove('success');
            displayElement.style.color = "#e74c3c";
            updateDisplay();
        }

        // Actualizar la pantalla (Muestra asteriscos o números)
        function updateDisplay() {
            if (currentInput === "") {
                displayElement.innerText = "----";
            } else {
                displayElement.innerText = currentInput;
            }
        }

        // Verificar el código
        function checkCode() {
            if (currentInput === CORRECT_CODE) {
                // Código Correcto
                displayElement.classList.add('success');
                displayElement.innerText = "OPEN";
                // Sonido opcional (puedes quitarlo si no quieres audio)
                // let audio = new Audio('success.mp3'); audio.play(); 
                
                setTimeout(() => {
                    doorElement.classList.add('open');
                }, 500);
            } else {
                // Código Incorrecto
                displayElement.innerText = "ERROR";
                let originalColor = displayElement.style.color;
                
                // Efecto de parpadeo simple
                setTimeout(() => { displayElement.innerText = "----"; currentInput = ""; }, 1000);
            }
        }
    </script>

</body>
</html>
