<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden Inductivo: Diagrama de Árbol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a; /* Fondo oscuro */
            color: #e2e8f0;
        }

        /* Efectos de brillo para hacerlo llamativo */
        .glow-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        
        /* Animaciones del árbol */
        .node-container {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: scale(0);
        }
        .node-container.visible {
            opacity: 1;
            transform: scale(1);
        }
        
        .tree-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 1s ease-out;
        }
        .tree-line.visible {
            stroke-dashoffset: 0;
        }

        /* Tarjeta de teoría */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Botón animado */
        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.6);
        }
        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">

    <header class="h-16 border-b border-slate-700/50 flex items-center px-8 bg-slate-900/80 backdrop-blur-md z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center font-bold text-white">I</div>
            <h1 class="text-xl font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-blue-400">Orden Inductivo</h1>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-full md:w-[400px] glass-panel border-r border-slate-700/50 flex flex-col z-10">
            
            <div id="contentArea" class="flex-1 p-8 overflow-y-auto">
                </div>

            <div class="p-6 border-t border-slate-700/50 bg-slate-900/40">
                <button id="actionBtn" class="btn-primary w-full py-4 rounded-xl font-bold text-white text-lg flex items-center justify-center gap-2 group">
                    <span id="btnText">Comenzar Explicación</span>
                    <svg id="btnIcon" class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                </button>
                
                <div class="mt-4 flex items-center gap-3">
                    <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-cyan-400 w-0 transition-all duration-500 shadow-[0_0_10px_#22d3ee]"></div>
                    </div>
                    <span id="stepCounter" class="text-xs text-slate-400 font-mono">0/5</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 relative bg-slate-900 flex items-center justify-center overflow-hidden">
            <div class="absolute inset-0" style="background-image: radial-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px); background-size: 40px 40px;"></div>
            
            <svg id="treeSvg" viewBox="0 0 800 500" class="w-full h-full max-w-5xl relative z-0">
                <defs>
                    <linearGradient id="gradRoot" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fbbf24" /> <stop offset="100%" stop-color="#d97706" />
                    </linearGradient>
                    <linearGradient id="grad0" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#22d3ee" /> <stop offset="100%" stop-color="#0891b2" />
                    </linearGradient>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#c084fc" /> <stop offset="100%" stop-color="#9333ea" />
                    </linearGradient>
                </defs>
                
                <g id="linesLayer"></g>
                <g id="nodesLayer"></g>
            </svg>

            <div id="statusTag" class="absolute top-8 right-8 bg-slate-800/80 backdrop-blur px-4 py-2 rounded-lg border border-cyan-500/30 text-cyan-300 text-sm font-mono hidden">
                Generando nivel: <span id="levelValue" class="font-bold text-white">Raíz</span>
            </div>
        </main>
    </div>

    <script>
        // --- CONFIGURACIÓN DE LOS PASOS ---
        const steps = [
            {
                // PASO 0: Definiciones
                type: 'intro',
                html: `
                    <div class="animate-fade-in space-y-6">
                        <div class="p-4 bg-slate-800/50 rounded-xl border-l-4 border-cyan-500">
                            <h3 class="text-cyan-400 font-bold text-lg mb-2">¿Qué es un Diagrama de Árbol?</h3>
                            <p class="text-slate-300 leading-relaxed">Es una representación gráfica que nos permite visualizar todas las posibilidades de un proceso. Como un mapa que muestra todos los caminos que podemos tomar.</p>
                        </div>
                        
                        <div class="p-4 bg-slate-800/50 rounded-xl border-l-4 border-purple-500">
                            <h3 class="text-purple-400 font-bold text-lg mb-2">¿Qué es el Orden Inductivo?</h3>
                            <p class="text-slate-300 leading-relaxed">Es una forma de organizar resultados donde cada nuevo elemento se construye paso a paso a partir de un caso inicial, siguiendo reglas claras, como crear lo nuevo basándose en lo anterior.</p>
                        </div>
                    </div>
                `,
                actionText: "Ir al Ejercicio"
            },
            {
                // PASO 1: Enunciado
                type: 'statement',
                html: `
                    <div class="animate-fade-in text-center mt-10">
                        <div class="inline-block p-4 rounded-full bg-slate-800 mb-4 border border-slate-600">
                            <span class="text-4xl">📝</span>
                        </div>
                        <h2 class="text-2xl font-bold text-white mb-4">Ejercicio Práctico</h2>
                        <p class="text-xl text-slate-300 mb-8">
                            Construir, usando el método inductivo, todas las combinaciones binarias (0 y 1) de longitud 3.
                        </p>
                        <div class="text-left bg-slate-900/50 p-4 rounded-lg text-sm text-slate-400 font-mono border border-slate-700">
                            Objetivo: { 000, 001, 010, ... }<br>
                            Método: Inducción (Paso a paso)
                        </div>
                    </div>
                `,
                actionText: "Colocar la Raíz"
            },
            {
                // PASO 2: La Raíz
                type: 'build',
                level: 0,
                html: `
                    <div class="animate-fade-in">
                        <h2 class="text-2xl font-bold text-amber-400 mb-2">Paso 1: La Raíz</h2>
                        <p class="text-slate-300 mb-4">Todo árbol comienza con un punto de origen.</p>
                        <p class="text-slate-400 text-sm leading-relaxed">
                            Esta es nuestra base. Aún no tenemos longitud, ni ceros ni unos. Es el punto de partida desde donde nacerán todas las ramas.
                        </p>
                    </div>
                `,
                nodes: [{ id: 'root', x: 400, y: 50, val: 'RAÍZ', parent: null, type: 'root' }],
                actionText: "Generar Longitud 1"
            },
            {
                // PASO 3: Nivel 1
                type: 'build',
                level: 1,
                html: `
                    <div class="animate-fade-in">
                        <h2 class="text-2xl font-bold text-cyan-400 mb-2">Paso 2: Primera Generación</h2>
                        <p class="text-slate-300 mb-4">De la raíz nacen nuestras opciones básicas: <strong>0</strong> y <strong>1</strong>.</p>
                        <div class="bg-slate-800 p-3 rounded border border-slate-600 mb-2">
                            <p class="font-mono text-cyan-300">0</p>
                            <p class="font-mono text-purple-300">1</p>
                        </div>
                        <p class="text-sm text-slate-400">Ahora tenemos palabras de longitud 1.</p>
                    </div>
                `,
                nodes: [
                    { id: '0', x: 200, y: 180, val: '0', parent: 'root', type: '0' },
                    { id: '1', x: 600, y: 180, val: '1', parent: 'root', type: '1' }
                ],
                actionText: "Generar Longitud 2"
            },
            {
                // PASO 4: Nivel 2
                type: 'build',
                level: 2,
                html: `
                    <div class="animate-fade-in">
                        <h2 class="text-2xl font-bold text-blue-400 mb-2">Paso 3: Segunda Generación</h2>
                        <p class="text-slate-300 mb-4">Aquí aplicamos la <strong>Inducción</strong>.</p>
                        <p class="text-slate-400 text-sm mb-4">A cada elemento que ya existía (0 y 1), le agregamos nuevamente un 0 y un 1.</p>
                        <ul class="text-sm space-y-2 font-mono text-slate-300">
                            <li>0 → <span class="text-cyan-400">00</span>, <span class="text-purple-400">01</span></li>
                            <li>1 → <span class="text-cyan-400">10</span>, <span class="text-purple-400">11</span></li>
                        </ul>
                    </div>
                `,
                nodes: [
                    { id: '00', x: 100, y: 320, val: '00', parent: '0', type: '0' },
                    { id: '01', x: 300, y: 320, val: '01', parent: '0', type: '1' },
                    { id: '10', x: 500, y: 320, val: '10', parent: '1', type: '0' },
                    { id: '11', x: 700, y: 320, val: '11', parent: '1', type: '1' }
                ],
                actionText: "Generar Longitud 3 (Final)"
            },
            {
                // PASO 5: Nivel 3 (Final)
                type: 'build',
                level: 3,
                html: `
                    <div class="animate-fade-in">
                        <h2 class="text-2xl font-bold text-green-400 mb-2">Paso Final: Longitud 3</h2>
                        <p class="text-slate-300 mb-4">Repetimos el proceso una última vez.</p>
                        <p class="text-slate-400 text-sm mb-4">Hemos construido todas las combinaciones posibles de forma ordenada y sin saltarnos ninguna.</p>
                        <div class="p-3 bg-green-900/20 border border-green-500/30 rounded text-center">
                            <span class="text-green-400 font-bold text-xl">Total: 8 Palabras</span>
                        </div>
                    </div>
                `,
                nodes: [
                    { id: '000', x: 50, y: 450, val: '000', parent: '00', type: '0' },
                    { id: '001', x: 150, y: 450, val: '001', parent: '00', type: '1' },
                    { id: '010', x: 250, y: 450, val: '010', parent: '01', type: '0' },
                    { id: '011', x: 350, y: 450, val: '011', parent: '01', type: '1' },
                    { id: '100', x: 450, y: 450, val: '100', parent: '10', type: '0' },
                    { id: '101', x: 550, y: 450, val: '101', parent: '10', type: '1' },
                    { id: '110', x: 650, y: 450, val: '110', parent: '11', type: '0' },
                    { id: '111', x: 750, y: 450, val: '111', parent: '11', type: '1' }
                ],
                actionText: "Reiniciar Ejercicio"
            }
        ];

        // --- LÓGICA DEL PROGRAMA ---
        let currentStep = 0;
        const contentArea = document.getElementById('contentArea');
        const actionBtn = document.getElementById('actionBtn');
        const btnText = document.getElementById('btnText');
        const progressBar = document.getElementById('progressBar');
        const stepCounter = document.getElementById('stepCounter');
        const linesLayer = document.getElementById('linesLayer');
        const nodesLayer = document.getElementById('nodesLayer');
        const statusTag = document.getElementById('statusTag');
        const levelValue = document.getElementById('levelValue');

        function init() {
            renderStep(0);
        }

        function renderStep(index) {
            const step = steps[index];
            
            // 1. Actualizar Texto Lateral
            contentArea.innerHTML = step.html;
            
            // 2. Actualizar Botón y Progreso
            if (index === steps.length - 1) {
                btnText.textContent = "Reiniciar Ejercicio";
                document.getElementById('btnIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />';
            } else {
                btnText.textContent = step.actionText;
                document.getElementById('btnIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />';
            }

            const progress = ((index) / (steps.length - 1)) * 100;
            progressBar.style.width = `${progress}%`;
            stepCounter.textContent = `${index}/${steps.length - 1}`;

            // 3. Lógica Visual (SVG)
            if (step.type === 'intro' || step.type === 'statement') {
                // Limpiar SVG si volvemos al inicio
                linesLayer.innerHTML = '';
                nodesLayer.innerHTML = '';
                statusTag.classList.add('hidden');
            } else if (step.type === 'build') {
                statusTag.classList.remove('hidden');
                levelValue.textContent = step.level === 0 ? "Raíz" : `Longitud ${step.level}`;
                drawNodes(step.nodes);
            }
        }

        function drawNodes(newNodes) {
            newNodes.forEach((node, i) => {
                // Dibujar línea desde el padre
                if (node.parent) {
                    const parentEl = document.getElementById(`circle-${node.parent}`);
                    if (parentEl) {
                        const x1 = parseFloat(parentEl.getAttribute('cx'));
                        const y1 = parseFloat(parentEl.getAttribute('cy'));
                        
                        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", x1);
                        line.setAttribute("y1", y1);
                        line.setAttribute("x2", node.x);
                        line.setAttribute("y2", node.y);
                        // Color de línea según si va a 0 (Cyan) o 1 (Morado)
                        const strokeColor = node.type === '0' ? '#22d3ee' : '#c084fc';
                        line.setAttribute("stroke", strokeColor);
                        line.setAttribute("stroke-width", "2");
                        line.setAttribute("class", "tree-line");
                        
                        linesLayer.appendChild(line);
                        
                        // Animación línea
                        setTimeout(() => line.classList.add('visible'), i * 150);
                    }
                }

                // Grupo del nodo
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "node-container");
                g.setAttribute("transform-origin", `${node.x}px ${node.y}px`);

                // Círculo
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("id", `circle-${node.id}`);
                circle.setAttribute("cx", node.x);
                circle.setAttribute("cy", node.y);
                circle.setAttribute("r", node.type === 'root' ? 25 : 18);
                
                // Asignar gradiente
                let fillUrl = "url(#gradRoot)";
                if (node.type === '0') fillUrl = "url(#grad0)";
                if (node.type === '1') fillUrl = "url(#grad1)";
                
                circle.setAttribute("fill", fillUrl);
                // Brillo externo
                circle.setAttribute("filter", "drop-shadow(0 0 4px rgba(255,255,255,0.5))");

                // Texto
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", node.x);
                text.setAttribute("y", node.y + 5);
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("fill", "white");
                text.setAttribute("font-weight", "bold");
                text.setAttribute("font-size", node.type === 'root' ? "10" : "12");
                text.textContent = node.val;

                g.appendChild(circle);
                g.appendChild(text);
                nodesLayer.appendChild(g);

                // Animación nodo (un poco después de la línea)
                setTimeout(() => g.classList.add('visible'), i * 150 + 300);
            });
        }

        actionBtn.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep(currentStep);
            } else {
                // Reiniciar
                currentStep = 0;
                renderStep(0);
            }
        });

        // Iniciar
        init();
    </script>
</body>
</html>
