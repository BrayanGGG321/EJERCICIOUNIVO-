<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinámica de Cartas - Parcial I</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary-color: #2c3e50;
            --card-front: #34495e;
            --card-exercise: #2980b9;
            --card-special: #f39c12;
            --card-penalty: #e74c3c;
            --text-light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            flex-grow: 1;
        }

        .card {
            perspective: 1000px;
            cursor: pointer;
            width: 100%;
            aspect-ratio: 3/4;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.4;
        }

        .card-front {
            background-color: var(--card-front);
            color: var(--text-light);
            font-size: 2rem;
            border: 2px solid #2c3e50;
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.05) 0px,
                rgba(255, 255, 255, 0.05) 10px,
                transparent 10px,
                transparent 20px
            );
        }

        .card-back {
            transform: rotateY(180deg);
            border: 2px solid transparent;
        }

        .card-back.exercise {
            background-color: var(--card-exercise);
            color: white;
            border-color: #1f618d;
        }

        .card-back.special {
            background-color: var(--card-special);
            color: #fff;
            border-color: #d68910;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .card-back.penalty {
            background-color: var(--card-penalty);
            color: white;
            border-color: #c0392b;
        }

        @media (max-width: 1024px) {
            .grid-container { grid-template-columns: repeat(5, 1fr); }
        }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(4, 1fr); }
            .card-face { font-size: 0.9rem; padding: 10px; }
            .card-front { font-size: 1.5rem; }
        }

        @media (max-width: 480px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .card-face { font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>

    <h1>Actividad de Repaso - Parcial I</h1>
    <div class="grid-container" id="cardGrid"></div>

    <script>
        // Definición de las 30 cartas
        const cardsData = [
            // 20 de Ejercicio
            ...Array(20).fill({ text: "Ejercicio", type: "exercise" }),
            
            // 10 Especiales / Dinámicas
            { text: "Intercambia puntos obligatoriamente con cualquier grupo", type: "special" },
            { text: "Intercambia puntos obligatoriamente con cualquier grupo", type: "special" },
            { text: "¡Has ganado la pizza para el grado!", type: "special" },
            { text: "Pierdes un punto", type: "penalty" },
            { text: "Pierdes un punto", type: "penalty" },
            { text: "Ganas 5 minutos con el cuaderno para el parcial I", type: "special" },
            { text: "Ganas 2 puntos al parcial si tu nota es ≥ 7", type: "special" },
            { text: "Ganas 2 puntos al parcial si tu nota es ≥ 7", type: "special" },
            { text: "Pierdes todos tus puntos", type: "penalty" },
            { text: "Ganas 5 puntos", type: "special" }
        ];

        // Función para mezclar aleatoriamente (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Inicializar el tablero
        function initGame() {
            const grid = document.getElementById('cardGrid');
            const shuffledCards = shuffle([...cardsData]);

            shuffledCards.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front">
                            ${index + 1}
                        </div>
                        <div class="card-face card-back ${data.type}">
                            ${data.text}
                        </div>
                    </div>
                `;

                // Evento para voltear la carta
                card.addEventListener('click', () => {
                    card.classList.toggle('flipped');
                });

                grid.appendChild(card);
            });
        }

        // Cargar el juego al iniciar
        window.onload = initGame;
    </script>

</body>
</html>
