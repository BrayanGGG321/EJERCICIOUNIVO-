<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulación masa‑resorte (retorno lento y sin oscilaciones)</title>
<style>
  body,html{
    margin:0;padding:0;height:100%;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f4f8;
    user-select:none;
  }
  #container{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  #wall{
    position:absolute;left:5%;width:30px;height:200px;background:#555;
  }
  #block{
    position:absolute;width:80px;height:80px;
    background:#4a90e2;border-radius:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:bold;box-shadow:0 4px 8px rgba(0,0,0,0.2);
  }
  #equilibrium{
    position:absolute;left:calc(5% + 30px);
    width:2px;height:220px;background:#d9534f;
    transform:translateX(-50%);
  }
  #info{
    position:absolute;top:10px;right:10px;
    background:rgba(255,255,255,0.9);padding:8px 12px;
    border-radius:6px;font-size:14px;line-height:1.4;
  }
  .arrow{
    position:absolute;width:0;height:0;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-bottom:20px solid #e67e22;
    transform-origin:50% 0%;transition:transform 0.1s linear;
  }
</style>
</head>
<body>
<div id="container">
  <div id="wall"></div>
  <div id="equilibrium"></div>
  <div id="block">Masa</div>
  <canvas id="springCanvas"></canvas>

  <div id="info">
    <div><strong>k</strong> = <span id="kVal">200</span> N/m</div>
    <div><strong>m</strong> = <span id="mVal">1</span> kg</div>
    <div><strong>F</strong> = -k·x = <span id="forceVal">0</span> N</div>
    <div><strong>x</strong> = <span id="xVal">0</span> m</div>
    <div>Estado: <span id="stateVal">Equilibrio</span></div>
  </div>

  <div class="arrow" id="forceArrow"></div>
</div>

<script>
/* -----------------------------------------------------------------
   Parámetros físicos (más rígido)
----------------------------------------------------------------- */
const k = 200;               // constante elástica (N/m) – más rígido
const m = 1;                 // masa (kg) – no usada en animación simple
const PIXELS_PER_METER = 200; // escala visual

/* Posiciones (píxeles) */
const wallX = window.innerWidth * 0.05 + 30; // límite derecho de la pared
let equilibriumX = wallX + 150;              // posición natural del resorte
let blockX = equilibriumX;                   // posición actual del bloque

/* DOM */
const container = document.getElementById('container');
const block = document.getElementById('block');
const canvas = document.getElementById('springCanvas');
const ctx = canvas.getContext('2d');
const forceArrow = document.getElementById('forceArrow');
const xVal = document.getElementById('xVal');
const forceVal = document.getElementById('forceVal');
const stateVal = document.getElementById('stateVal');

/* -----------------------------------------------------------------
   Canvas
----------------------------------------------------------------- */
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize',()=>{resizeCanvas();draw();});
resizeCanvas();

/* -----------------------------------------------------------------
   Dibujar el resorte como zig‑zag
----------------------------------------------------------------- */
function drawSpring(){
  const startX = wallX;
  const endX   = blockX;
  const y = container.clientHeight/2;
  const coilCount = 8;
  const coilWidth = (endX-startX)/(coilCount*2);
  ctx.strokeStyle='#2c3e50';
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(startX,y);
  for(let i=0;i<coilCount;i++){
    const nx = startX + (2*i+1)*coilWidth;
    const ny = (i%2===0)? y-20 : y+20;
    ctx.lineTo(nx,ny);
    ctx.lineTo(nx+coilWidth,y);
  }
  ctx.stroke();
}

/* -----------------------------------------------------------------
   Render completo
----------------------------------------------------------------- */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawSpring();

  // bloque
  block.style.top = `${container.clientHeight/2 - block.offsetHeight/2}px`;
  block.style.left = `${blockX - block.offsetWidth/2}px`;

  // flecha de fuerza
  const dir = blockX>equilibriumX ? -1 : (blockX<equilibriumX ? 1 : 0);
  const arrowSize=30;
  forceArrow.style.top = `${container.clientHeight/2 - arrowSize}px`;
  forceArrow.style.left = `${blockX - arrowSize/2}px`;
  forceArrow.style.transform = `rotate(${dir*180}deg)`;
  forceArrow.style.display = dir===0 ? 'none' : 'block';

  // cálculo de desplazamiento y fuerza
  const xMeters = (blockX-equilibriumX)/PIXELS_PER_METER;
  const force = -k*xMeters;
  xVal.textContent = xMeters.toFixed(3);
  forceVal.textContent = force.toFixed(2);
  if(Math.abs(xMeters)<0.001){
    stateVal.textContent='Equilibrio';
    xVal.textContent='0';
    forceVal.textContent='0';
  }else if(xMeters>0){
    stateVal.textContent='Estirado';
  }else{
    stateVal.textContent='Comprimido';
  }
}

/* -----------------------------------------------------------------
   Interacción (drag)
----------------------------------------------------------------- */
let dragging = false;
let dragOffset = 0;
let returnAnimId = null;   // id del requestAnimationFrame de retorno

block.addEventListener('mousedown',e=>{
  dragging = true;
  const rect = block.getBoundingClientRect();
  dragOffset = e.clientX - (rect.left + rect.width/2);
  cancelReturnAnimation();   // interrumpir retorno si lo estaba
});

window.addEventListener('mousemove',e=>{
  if(!dragging) return;
  const newX = e.clientX - dragOffset;
  const minX = wallX + 40;                     // evitar pasar la pared
  const maxX = container.clientWidth - 40;    // borde derecho
  blockX = Math.min(Math.max(newX,minX),maxX);
  draw();
});

window.addEventListener('mouseup',()=>{ 
  if(!dragging) return;
  dragging = false;
  startReturnAnimation();   // iniciar regreso lento y único
});

/* -----------------------------------------------------------------
   Animación de retorno (una sola trayectoria, lenta)
----------------------------------------------------------------- */
function cancelReturnAnimation(){
  if(returnAnimId!==null){
    cancelAnimationFrame(returnAnimId);
    returnAnimId = null;
  }
}
function startReturnAnimation(){
  const startX = blockX;
  const deltaX = equilibriumX - startX;
  const duration = 2000;                // 2 s (cámara lenta)
  const startTime = performance.now();

  function step(now){
    const elapsed = now - startTime;
    const t = Math.min(elapsed/duration,1); // 0‑1
    // Ease‑out (cuadrático) para que arranque rápido y termine suavemente
    const ease = 1 - (1-t)*(1-t);
    blockX = startX + deltaX*ease;
    draw();
    if(t<1){
      returnAnimId = requestAnimationFrame(step);
    }else{
      // Aseguramos posición exacta de equilibrio al terminar
      blockX = equilibriumX;
      draw();
      returnAnimId = null;
    }
  }
  returnAnimId = requestAnimationFrame(step);
}

/* -----------------------------------------------------------------
   Inicialización
----------------------------------------------------------------- */
draw();   // estado inicial
</script>
</body>
</html>
