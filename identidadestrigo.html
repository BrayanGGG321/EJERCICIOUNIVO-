<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Multijugador - Identidades Trigonométricas</title>
    
    <!-- Tailwind para la estructura general -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax para renderizar LaTeX de las fórmulas matemáticas -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false // Lo controlaremos manualmente
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #1e3a8a; /* Blue 900 */
            --secondary: #3b82f6; /* Blue 500 */
            --accent: #f59e0b; /* Amber 500 */
            --bg: #f3f4f6; /* Gray 100 */
            --card-bg: #ffffff;
            --success: #10b981;
            --error: #ef4444;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); }

        .perspective-1000 { perspective: 1000px; }
        
        .transform-style-3d { transform-style: preserve-3d; }
        
        .backface-hidden { backface-visibility: hidden; }

        .card {
            width: 100%;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped { transform: rotateY(180deg); }
        .card.matched { transform: rotateY(180deg); opacity: 0.5; cursor: default; }

        .card-front {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-back {
            background-color: var(--card-bg);
            transform: rotateY(180deg);
            border: 2px solid var(--secondary);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            font-size: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Contenedor Modal */
        #zoom-modal { backdrop-filter: blur(5px); }
        
        .large-card {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 1rem;
            padding: 2rem;
            min-width: 250px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem; /* Fórmula en grande */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .math-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center py-8 px-4">

    <h1 class="text-3xl md:text-4xl font-extrabold text-blue-900 mb-8 text-center drop-shadow-sm">
        Desafío Trigonométrico Multijugador
    </h1>

    <!-- Pantalla 1: Registro y Sala de Espera -->
    <div id="setup-screen" class="w-full max-w-md bg-white rounded-xl shadow-xl p-8 text-center">
        <h2 class="text-2xl font-bold mb-6 text-gray-700">Unirse a la Partida</h2>
        <div id="join-form">
            <input type="text" id="team-name" placeholder="Nombre de tu Equipo" 
                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 mb-6 text-lg">
            <button id="btn-join" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Entrar al Juego
            </button>
        </div>
        <div id="waiting-msg" class="hidden flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-lg text-gray-600 font-medium">Esperando a que se una el equipo rival...</p>
            <p class="text-sm text-gray-400 mt-2">Dile al otro equipo que ingrese desde su dispositivo.</p>
        </div>
    </div>

    <!-- Pantalla 2: El Juego -->
    <div id="game-screen" class="hidden w-full max-w-5xl">
        
        <!-- Marcador Multijugador -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white rounded-xl shadow-md p-4 mb-8">
            <div id="player1-score" class="text-xl font-bold px-4 py-2 rounded-lg transition-colors">
                Equipo 1: 0
            </div>
            
            <div id="turn-indicator" class="text-lg font-semibold my-2 md:my-0 px-6 py-2 bg-gray-100 rounded-full text-center">
                Cargando estado...
            </div>
            
            <div id="player2-score" class="text-xl font-bold px-4 py-2 rounded-lg transition-colors">
                Equipo 2: 0
            </div>
        </div>

        <!-- Tablero de Cartas -->
        <div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3 perspective-1000" id="card-grid">
            <!-- Las cartas se inyectarán aquí -->
        </div>
    </div>

    <!-- Pantalla 3: Modal Sincronizado para Verificar -->
    <div id="zoom-modal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex-col justify-center items-center p-4">
        <div class="bg-white rounded-2xl p-6 md:p-10 text-center max-w-4xl w-full">
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-8">¿Son equivalentes?</h3>
            
            <div class="flex flex-col md:flex-row justify-center items-center gap-6 mb-10">
                <div id="modal-card-1" class="large-card"></div>
                <div class="text-3xl font-bold text-gray-400">=</div>
                <div id="modal-card-2" class="large-card"></div>
            </div>

            <!-- Interfaz dinámica según el turno -->
            <div id="modal-active-ui" class="hidden">
                <button id="btn-verify" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-10 rounded-lg text-xl transition-colors shadow-lg">
                    Verificar Pareja
                </button>
            </div>
            <div id="modal-waiting-ui" class="hidden">
                <p class="text-xl text-gray-500 animate-pulse font-semibold" id="waiting-verify-text">
                    Esperando a que el rival verifique...
                </p>
            </div>
            
            <div id="modal-result-ui" class="hidden mt-6">
                <p id="result-text" class="text-3xl font-extrabold"></p>
            </div>
        </div>
    </div>

    <!-- Pantalla 4: Fin del Juego -->
    <div id="winner-screen" class="hidden w-full max-w-md bg-white rounded-xl shadow-xl p-8 text-center mt-10">
        <h2 class="text-4xl font-extrabold text-amber-500 mb-4">¡Juego Terminado!</h2>
        <p id="winner-text" class="text-2xl text-gray-700 font-bold mb-8"></p>
        <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg w-full">
            Volver al Inicio
        </button>
    </div>

    <script type="module">
        // Importaciones estrictas de Firebase SDK 11.6.1
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de entorno inyectada
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-trigo-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Fallback si corre fuera del entorno (no funcionará sin config real, pero previene errores sintácticos)
            projectId: "demo-project"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Identificadores globales
        let userId = null;
        const ROOM_ID = 'trigo_room_1'; // Usamos una sala global fija para esta demostración
        // RUTA ESTRICTA requerida por las reglas:
        const roomPath = ['artifacts', appId, 'public', 'data', 'sessions', ROOM_ID];

        // Estado local
        let isMyTurn = false;
        let localBoardRendered = false;

        // Las 16 identidades
        const equations = [
            { id: 0, left: "\\sin^2(x) + \\cos^2(x)", right: "1" },
            { id: 1, left: "1 + \\tan^2(\\theta)", right: "\\sec^2(\\theta)" },
            { id: 2, left: "\\frac{\\tan x}{\\sec x}", right: "\\sin x" },
            { id: 3, left: "\\frac{\\sin x}{\\cos x}", right: "\\tan x" },
            { id: 4, left: "\\cot(x)", right: "\\frac{\\cos(x)}{\\sin(x)}" },
            { id: 5, left: "\\sec x", right: "\\frac{1}{\\cos x}" },
            { id: 6, left: "\\sin(90^\\circ - x)", right: "\\cos(x)" },
            { id: 7, left: "\\cos(90^\\circ - x)", right: "\\sin(x)" },
            { id: 8, left: "\\tan(90^\\circ - x)", right: "\\cot(x)" },
            { id: 9, left: "\\sec(90^\\circ - x)", right: "\\csc(x)" },
            { id: 10, left: "\\sin x \\cdot \\csc x", right: "1" },
            { id: 11, left: "\\cos x \\cdot \\sec x", right: "1" },
            { id: 12, left: "\\sin^2\\frac{\\theta}{2}", right: "\\frac{1 - \\cos\\theta}{2}" },
            { id: 13, left: "\\sin(\\alpha + \\beta)", right: "\\sin(\\alpha)\\cos(\\beta) + \\cos(\\alpha)\\sin(\\beta)" },
            { id: 14, left: "\\sin(\\alpha) + \\sin(\\beta)", right: "2 \\sin\\left(\\frac{\\alpha + \\beta}{2}\\right) \\cos\\left(\\frac{\\alpha - \\beta}{2}\\right)" },
            { id: 15, left: "\\sin(2\\theta)", right: "2\\sin(\\theta)\\cos(\\theta)" }
        ];

        // Elementos UI
        const UI = {
            setupScreen: document.getElementById('setup-screen'),
            joinForm: document.getElementById('join-form'),
            waitingMsg: document.getElementById('waiting-msg'),
            gameScreen: document.getElementById('game-screen'),
            cardGrid: document.getElementById('card-grid'),
            score1: document.getElementById('player1-score'),
            score2: document.getElementById('player2-score'),
            turnInd: document.getElementById('turn-indicator'),
            modal: document.getElementById('zoom-modal'),
            modCard1: document.getElementById('modal-card-1'),
            modCard2: document.getElementById('modal-card-2'),
            modActiveUI: document.getElementById('modal-active-ui'),
            modWaitingUI: document.getElementById('modal-waiting-ui'),
            modResultUI: document.getElementById('modal-result-ui'),
            btnVerify: document.getElementById('btn-verify'),
            resultText: document.getElementById('result-text'),
            winnerScreen: document.getElementById('winner-screen'),
            winnerText: document.getElementById('winner-text')
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                userId = auth.currentUser.uid;
                
                // Si el usuario recarga la página, verificamos si ya estaba en la sala
                checkExistingSession();
            } catch (error) {
                console.error("Error de autenticación:", error);
                alert("Error al conectar con los servidores.");
            }
        }

        async function checkExistingSession() {
            if (!userId) return;
            const roomRef = doc(db, ...roomPath);
            const snap = await getDoc(roomRef);
            
            if (snap.exists()) {
                const data = snap.data();
                if (data.playerIds.includes(userId)) {
                    // Ya somos parte del juego, ocultar formulario y conectar listener
                    UI.joinForm.classList.add('hidden');
                    if (data.status === 'waiting') {
                        UI.waitingMsg.classList.remove('hidden');
                    }
                    listenToGame();
                }
            }
        }

        document.getElementById('btn-join').addEventListener('click', async () => {
            const name = document.getElementById('team-name').value.trim() || "Equipo Anónimo";
            if (!userId) return;

            UI.btnJoin = document.getElementById('btn-join');
            UI.btnJoin.disabled = true;
            UI.btnJoin.innerText = "Conectando...";

            try {
                const roomRef = doc(db, ...roomPath);
                const snap = await getDoc(roomRef);
                
                let isPlayer1 = false;
                let resetRoom = false;

                if (!snap.exists() || snap.data().status === 'finished') {
                    resetRoom = true;
                    isPlayer1 = true;
                } else {
                    const data = snap.data();
                    if (data.playerIds.length >= 2 && !data.playerIds.includes(userId)) {
                        // Sala llena, reiniciamos la sala para testing (en produccion seria "crear nueva sala")
                        resetRoom = true;
                        isPlayer1 = true;
                    }
                }

                if (resetRoom) {
                    // Crear nueva sesión / Reiniciar como Jugador 1
                    await setDoc(roomRef, {
                        status: 'waiting',
                        playerIds: [userId],
                        players: {
                            [userId]: { name: name, score: 0 }
                        },
                        turn: userId,
                        board: [],
                        flippedCards: [],
                        modal: { isOpen: false, showResult: false, isMatch: null }
                    });
                    
                    UI.joinForm.classList.add('hidden');
                    UI.waitingMsg.classList.remove('hidden');
                } else {
                    // Unirse como Jugador 2
                    const data = snap.data();
                    if (!data.playerIds.includes(userId)) {
                        const newPlayers = { ...data.players };
                        newPlayers[userId] = { name: name, score: 0 };
                        
                        // Generar el tablero aleatorio
                        const newBoard = generateBoard();

                        await updateDoc(roomRef, {
                            status: 'playing',
                            playerIds: [...data.playerIds, userId],
                            players: newPlayers,
                            board: newBoard
                        });
                    }
                }

                listenToGame(); // Iniciar sincronización en tiempo real

            } catch (err) {
                console.error("Error al unirse:", err);
                UI.btnJoin.disabled = false;
                UI.btnJoin.innerText = "Entrar al Juego";
            }
        });

        function generateBoard() {
            let deck = [];
            equations.forEach(eq => {
                deck.push({ id: eq.id, type: 'left', tex: `\\[ ${eq.left} \\]`, isFlipped: false, isMatched: false });
                deck.push({ id: eq.id, type: 'right', tex: `\\[ ${eq.right} \\]`, isFlipped: false, isMatched: false });
            });
            deck.sort(() => Math.random() - 0.5);
            deck.forEach((c, i) => c.index = i);
            return deck;
        }

        function buildDOMBoard(boardData) {
            UI.cardGrid.innerHTML = '';
            boardData.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card transform-style-3d';
                cardEl.id = `card-${card.index}`;
                
                cardEl.innerHTML = `
                    <div class="card-front absolute w-full h-full backface-hidden z-10">${card.index + 1}</div>
                    <div class="card-back absolute w-full h-full backface-hidden">
                        <div class="math-container">${card.tex}</div>
                    </div>
                `;
                
                cardEl.addEventListener('click', () => handleCardClick(card.index));
                UI.cardGrid.appendChild(cardEl);
            });
            
            // Renderizar las fórmulas con MathJax (solo se hace una vez)
            MathJax.typesetPromise([UI.cardGrid]).then(() => {
                localBoardRendered = true;
            });
        }

        let unsubscribe = null;
        let lastGameState = null;

        function listenToGame() {
            if (unsubscribe) unsubscribe();
            
            const roomRef = doc(db, ...roomPath);
            unsubscribe = onSnapshot(roomRef, (snap) => {
                if (!snap.exists()) return;
                
                const state = snap.data();
                lastGameState = state;
                
                // 1. Manejo de transiciones de pantalla
                if (state.status === 'playing') {
                    UI.setupScreen.classList.add('hidden');
                    UI.gameScreen.classList.remove('hidden');
                    
                    // Si el tablero no se ha construido en el DOM, construirlo
                    if (!localBoardRendered && state.board.length > 0) {
                        buildDOMBoard(state.board);
                    }
                } else if (state.status === 'finished') {
                    showWinner(state);
                    return; // Detener actualizaciones visuales del juego
                }

                // 2. Actualizar Marcador y Turnos
                if (state.status === 'playing') {
                    const p1Id = state.playerIds[0];
                    const p2Id = state.playerIds[1];
                    
                    isMyTurn = (state.turn === userId);

                    UI.score1.innerText = `${state.players[p1Id].name}: ${state.players[p1Id].score}`;
                    UI.score2.innerText = `${state.players[p2Id].name}: ${state.players[p2Id].score}`;

                    // Resaltar colores según el turno
                    if (state.turn === p1Id) {
                        UI.score1.classList.add('bg-amber-100', 'text-amber-800', 'border-2', 'border-amber-400');
                        UI.score2.classList.remove('bg-amber-100', 'text-amber-800', 'border-2', 'border-amber-400');
                    } else {
                        UI.score2.classList.add('bg-amber-100', 'text-amber-800', 'border-2', 'border-amber-400');
                        UI.score1.classList.remove('bg-amber-100', 'text-amber-800', 'border-2', 'border-amber-400');
                    }

                    if (isMyTurn) {
                        UI.turnInd.innerText = "¡Es tu turno!";
                        UI.turnInd.classList.add('bg-green-100', 'text-green-800');
                        UI.turnInd.classList.remove('bg-gray-100', 'text-gray-800');
                    } else {
                        const activePlayerName = state.players[state.turn].name;
                        UI.turnInd.innerText = `Turno de: ${activePlayerName}`;
                        UI.turnInd.classList.add('bg-gray-100', 'text-gray-800');
                        UI.turnInd.classList.remove('bg-green-100', 'text-green-800');
                    }

                    // 3. Actualizar estado visual de las cartas
                    if (localBoardRendered) {
                        state.board.forEach((card, i) => {
                            const domCard = document.getElementById(`card-${i}`);
                            if (domCard) {
                                if (card.isMatched) {
                                    domCard.classList.add('matched');
                                    domCard.classList.add('flipped');
                                } else if (card.isFlipped) {
                                    domCard.classList.add('flipped');
                                } else {
                                    domCard.classList.remove('flipped');
                                }
                            }
                        });
                    }

                    // 4. Lógica del Modal Sincronizado
                    manageModal(state);
                }

            }, (error) => {
                console.error("Error de sincronización:", error);
            });
        }

        async function handleCardClick(index) {
            if (!lastGameState) return;
            if (!isMyTurn) return; // Solo el jugador activo puede voltear
            if (lastGameState.flippedCards.length >= 2) return; // Máximo 2 cartas
            
            const cardData = lastGameState.board[index];
            if (cardData.isFlipped || cardData.isMatched) return; // No clickear cartas ya volteadas

            const roomRef = doc(db, ...roomPath);
            const newFlipped = [...lastGameState.flippedCards, index];
            
            // Actualizamos la carta específica en el arreglo (copia profunda simple)
            const newBoard = JSON.parse(JSON.stringify(lastGameState.board));
            newBoard[index].isFlipped = true;

            let updatePayload = {
                flippedCards: newFlipped,
                board: newBoard
            };

            // Si es la segunda carta, abrimos el modal para ambos
            if (newFlipped.length === 2) {
                updatePayload.modal = {
                    isOpen: true,
                    showResult: false,
                    isMatch: null
                };
            }

            await updateDoc(roomRef, updatePayload);
        }

        function manageModal(state) {
            if (state.modal.isOpen) {
                UI.modal.classList.remove('hidden');
                UI.modal.classList.add('flex');

                // Si no estamos mostrando el resultado aún, actualizamos el contenido
                if (!state.modal.showResult && state.flippedCards.length === 2) {
                    const c1 = state.board[state.flippedCards[0]];
                    const c2 = state.board[state.flippedCards[1]];
                    
                    UI.modCard1.innerHTML = `<div class="math-container">${c1.tex}</div>`;
                    UI.modCard2.innerHTML = `<div class="math-container">${c2.tex}</div>`;
                    MathJax.typesetPromise([UI.modCard1, UI.modCard2]);

                    UI.modResultUI.classList.add('hidden');
                    
                    // Mostrar UI según de quién es el turno
                    if (isMyTurn) {
                        UI.modActiveUI.classList.remove('hidden');
                        UI.modWaitingUI.classList.add('hidden');
                    } else {
                        UI.modActiveUI.classList.add('hidden');
                        UI.modWaitingUI.classList.remove('hidden');
                        const activeName = state.players[state.turn].name;
                        document.getElementById('waiting-verify-text').innerText = `Esperando a que ${activeName} verifique...`;
                    }
                }

                // Mostrar resultado si fue verificado
                if (state.modal.showResult) {
                    UI.modActiveUI.classList.add('hidden');
                    UI.modWaitingUI.classList.add('hidden');
                    UI.modResultUI.classList.remove('hidden');

                    if (state.modal.isMatch) {
                        UI.resultText.innerText = "¡Correcto! Punto ganado.";
                        UI.resultText.className = "text-3xl font-extrabold text-green-600";
                    } else {
                        UI.resultText.innerText = "Incorrecto. No forman pareja.";
                        UI.resultText.className = "text-3xl font-extrabold text-red-600";
                    }
                }

            } else {
                // Cerrar modal
                UI.modal.classList.add('hidden');
                UI.modal.classList.remove('flex');
                UI.modResultUI.classList.add('hidden');
            }
        }

        UI.btnVerify.addEventListener('click', async () => {
            if (!isMyTurn || !lastGameState) return;
            
            // Prevenir doble click
            UI.btnVerify.disabled = true;

            const idx1 = lastGameState.flippedCards[0];
            const idx2 = lastGameState.flippedCards[1];
            const c1 = lastGameState.board[idx1];
            const c2 = lastGameState.board[idx2];

            // Regla matemática de coincidencia
            let isMatch = (c1.id === c2.id && c1.type !== c2.type);
            const onesIds = [0, 10, 11]; // Fórmulas que equivalen a "1"
            if (!isMatch && onesIds.includes(c1.id) && onesIds.includes(c2.id) && c1.type !== c2.type) {
                isMatch = true; // Permite combinar cualquier 1 con cualquier fórmula de valor 1
            }

            const roomRef = doc(db, ...roomPath);

            // Primero emitimos el resultado para que ambos dispositivos lo vean
            await updateDoc(roomRef, {
                'modal.showResult': true,
                'modal.isMatch': isMatch
            });

            // Esperamos 2.5 segundos para que los jugadores lean el resultado, 
            // luego procesamos lógica de tablero
            setTimeout(async () => {
                try {
                    const freshSnap = await getDoc(roomRef);
                    const freshState = freshSnap.data();
                    
                    const newBoard = JSON.parse(JSON.stringify(freshState.board));
                    let nextTurn = freshState.turn;
                    let p1Score = freshState.players[freshState.playerIds[0]].score;
                    let p2Score = freshState.players[freshState.playerIds[1]].score;
                    let matchedCount = 0;

                    if (isMatch) {
                        newBoard[idx1].isMatched = true;
                        newBoard[idx2].isMatched = true;
                        // Sumar punto al activo
                        if (freshState.turn === freshState.playerIds[0]) p1Score++;
                        else p2Score++;
                        // El turno NO cambia (mantiene el turno por acertar)
                    } else {
                        newBoard[idx1].isFlipped = false;
                        newBoard[idx2].isFlipped = false;
                        // Cambiar turno
                        nextTurn = (freshState.turn === freshState.playerIds[0]) ? freshState.playerIds[1] : freshState.playerIds[0];
                    }

                    // Contar parejas completadas para ver si el juego termina
                    newBoard.forEach(c => { if(c.isMatched) matchedCount++; });
                    const isFinished = (matchedCount === 32);

                    const updateData = {
                        board: newBoard,
                        flippedCards: [],
                        modal: { isOpen: false, showResult: false, isMatch: null },
                        turn: nextTurn,
                        [`players.${freshState.playerIds[0]}.score`]: p1Score,
                        [`players.${freshState.playerIds[1]}.score`]: p2Score
                    };

                    if (isFinished) {
                        updateData.status = 'finished';
                    }

                    await updateDoc(roomRef, updateData);
                    UI.btnVerify.disabled = false; // Restaurar botón

                } catch (e) {
                    console.error("Error actualizando turnos:", e);
                    UI.btnVerify.disabled = false;
                }
            }, 2500);
        });

        function showWinner(state) {
            UI.gameScreen.classList.add('hidden');
            UI.modal.classList.add('hidden');
            UI.winnerScreen.classList.remove('hidden');

            const p1 = state.players[state.playerIds[0]];
            const p2 = state.players[state.playerIds[1]];

            if (p1.score > p2.score) {
                UI.winnerText.innerText = `¡${p1.name} gana con ${p1.score} puntos!`;
            } else if (p2.score > p1.score) {
                UI.winnerText.innerText = `¡${p2.name} gana con ${p2.score} puntos!`;
            } else {
                UI.winnerText.innerText = `¡Empate espectacular a ${p1.score} puntos!`;
            }
        }

        // Arrancar la app
        initAuth();

    </script>
</body>
</html>
