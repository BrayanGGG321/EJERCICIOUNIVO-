<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria - Identidades Trigonométricas</title>
    
    <!-- MathJax para renderizar LaTeX -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- PeerJS para conexión Multijugador sin servidor -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <style>
        :root {
            --primary: #1a5276;
            --secondary: #2980b9;
            --accent: #f39c12;
            --bg: #ecf0f1;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --success: #27ae60;
            --error: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--primary); text-align: center; }

        /* Pantallas de Configuración */
        .screen {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 50px;
            max-width: 500px;
            width: 100%;
        }

        #setup-screen, #host-screen, #join-screen, #game-screen, #winner-screen {
            display: none;
        }

        input {
            padding: 10px;
            margin: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            font-size: 16px;
            width: 80%;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 10px;
        }

        button:hover { background-color: var(--primary); }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }

        .pin-display {
            font-size: 3em;
            color: var(--accent);
            letter-spacing: 5px;
            font-weight: bold;
            margin: 20px 0;
        }

        /* Pantalla de Juego */
        #game-screen { width: 100%; max-width: 1200px; margin-top: 20px; box-shadow: none; background: transparent; padding: 0;}

        .scoreboard {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .team-active {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped { transform: rotateY(180deg); }
        .card.matched { transform: rotateY(180deg); opacity: 0.7; cursor: default; }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 10px;
            box-sizing: border-box;
        }

        .card-front {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            font-size: 2em;
            font-weight: bold;
        }

        .card-back {
            background-color: var(--card-bg);
            color: var(--text);
            transform: rotateY(180deg);
            border: 2px solid var(--secondary);
            font-size: 1em;
            text-align: center;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal para ver cartas en grande */
        #zoom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-cards-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .large-card {
            background: white;
            border: 4px solid var(--secondary);
            border-radius: 15px;
            padding: 30px;
            min-width: 200px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #modal-result {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 40px;
        }
        
        #modal-btn { font-size: 1.2em; padding: 15px 40px; }
        #winner-screen h2 { color: var(--accent); font-size: 2.5em; }
    </style>
</head>
<body>

    <h1>Emparejamiento Trigonométrico</h1>

    <!-- Pantalla Inicial -->
    <div id="setup-screen" class="screen" style="display: block;">
        <h2>Ingreso al Juego</h2>
        <input type="text" id="my-team-name" placeholder="Nombre de tu Equipo" autocomplete="off">
        <br>
        <button onclick="showHostScreen()">Crear Sala (Equipo 1)</button>
        <button onclick="showJoinScreen()">Unirse a Sala (Equipo 2)</button>
    </div>

    <!-- Pantalla de Anfitrión (Espera) -->
    <div id="host-screen" class="screen">
        <h2>Sala Creada</h2>
        <p>Pide al otro equipo que ingrese este PIN para unirse:</p>
        <div class="pin-display" id="room-pin-display">...</div>
        <p id="host-status">Esperando conexión...</p>
    </div>

    <!-- Pantalla de Invitado (Unirse) -->
    <div id="join-screen" class="screen">
        <h2>Unirse a la Partida</h2>
        <input type="text" id="join-pin" placeholder="Ingresa el PIN de 5 dígitos" maxlength="5" autocomplete="off">
        <br>
        <button id="btn-join" onclick="joinRoom()">Conectar</button>
        <p id="join-status" style="color: var(--error);"></p>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen" class="screen">
        <div class="scoreboard">
            <div id="score-team1">Equipo 1: 0</div>
            <div id="turn-indicator" style="color: #7f8c8d; font-weight: normal;">Turno de...</div>
            <div id="score-team2">Equipo 2: 0</div>
        </div>
        <div class="grid" id="card-grid"></div>
    </div>

    <!-- Modal para visualización en grande -->
    <div id="zoom-modal">
        <div class="modal-content">
            <div id="modal-result">Verificando...</div>
            <div class="modal-cards-container">
                <div id="modal-card-1" class="large-card"></div>
                <div id="modal-card-2" class="large-card"></div>
            </div>
            <button id="modal-btn">Verificar</button>
        </div>
    </div>

    <!-- Pantalla de Ganador -->
    <div id="winner-screen" class="screen">
        <h2 id="winner-text"></h2>
        <button onclick="location.reload()">Jugar de Nuevo</button>
    </div>

    <script>
        const equations = [
            { id: 0, left: "\\sin^2(x) + \\cos^2(x)", right: "1" },
            { id: 1, left: "1 + \\tan^2(\\theta)", right: "\\sec^2(\\theta)" },
            { id: 2, left: "\\frac{\\tan x}{\\sec x}", right: "\\sin x" },
            { id: 3, left: "\\frac{\\sin x}{\\cos x}", right: "\\tan x" },
            { id: 4, left: "\\cot(x)", right: "\\frac{\\cos(x)}{\\sin(x)}" },
            { id: 5, left: "\\sec x", right: "\\frac{1}{\\cos x}" },
            { id: 6, left: "\\sin(90^\\circ - \\theta)", right: "\\cos(\\theta)" },
            { id: 7, left: "\\cos(90^\\circ - \\theta)", right: "\\sin(\\theta)" },
            { id: 8, left: "\\tan(90^\\circ - \\theta)", right: "\\cot(\\theta)" },
            { id: 9, left: "\\sec(90^\\circ - \\theta)", right: "\\csc(\\theta)" },
            { id: 10, left: "\\sin \\theta \\cdot \\csc \\theta", right: "1" },
            { id: 11, left: "\\cos x \\cdot \\sec x", right: "1" },
            { id: 12, left: "\\sin^2\\frac{\\theta}{2}", right: "\\frac{1 - \\cos\\theta}{2}" },
            { id: 13, left: "\\sin(\\alpha + \\beta)", right: "\\sin(\\alpha)\\cos(\\beta) + \\cos(\\alpha)\\sin(\\beta)" },
            { id: 14, left: "\\sin(\\alpha) + \\sin(\\beta)", right: "2 \\sin\\left(\\frac{\\alpha + \\beta}{2}\\right) \\cos\\left(\\frac{\\alpha - \\beta}{2}\\right)" },
            { id: 15, left: "\\sin(2\\theta)", right: "2\\sin(\\theta)\\cos(\\theta)" }
        ];

        // Variables de red y multijugador
        let peer = null;
        let conn = null;
        let isHost = false;
        let myName = "";
        let opponentName = "";
        
        // Variables del juego
        let deck = [];
        let scores = [0, 0]; // [Host, Guest]
        let currentTurn = 0; // 0 = Host, 1 = Guest
        let flippedCards = [];
        let matchedPairs = 0;
        let lockBoard = false;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'game-screen') document.getElementById('game-screen').style.display = 'block';
        }

        // --- LÓGICA DE RED (PEERJS) ---

        function showHostScreen() {
            myName = document.getElementById('my-team-name').value.trim() || "Equipo 1";
            isHost = true;
            showScreen('host-screen');
            
            const pin = Math.floor(10000 + Math.random() * 90000).toString();
            document.getElementById('room-pin-display').innerText = pin;
            
            peer = new Peer('trigo-juego-' + pin);
            
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function showJoinScreen() {
            myName = document.getElementById('my-team-name').value.trim() || "Equipo 2";
            isHost = false;
            showScreen('join-screen');
        }

        function joinRoom() {
            const pin = document.getElementById('join-pin').value.trim();
            if(pin.length !== 5) {
                document.getElementById('join-status').innerText = "El PIN debe tener 5 números.";
                return;
            }
            
            document.getElementById('btn-join').disabled = true;
            document.getElementById('join-status').innerText = "Conectando...";
            document.getElementById('join-status').style.color = "var(--text)";

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect('trigo-juego-' + pin);
                setupConnection();
                
                // Si no se conecta en 5 segundos, error
                setTimeout(() => {
                    if(!conn || !conn.open) {
                        document.getElementById('join-status').innerText = "Error: Verifica el PIN e intenta de nuevo.";
                        document.getElementById('join-status').style.color = "var(--error)";
                        document.getElementById('btn-join').disabled = false;
                    }
                }, 5000);
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                if (!isHost) {
                    // El invitado avisa que entró
                    conn.send({ type: 'guest_join', name: myName });
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'guest_join' && isHost) {
                    opponentName = data.name;
                    startGameAsHost();
                } 
                else if (data.type === 'init_game' && !isHost) {
                    opponentName = data.hostName;
                    deck = data.deck;
                    initGameUI();
                }
                else if (data.type === 'flip_card') {
                    const card = document.querySelector(`.card[data-index='${data.index}']`);
                    processCardFlip(card, false);
                }
                else if (data.type === 'resolve_modal') {
                    resolveModalResult(data.isMatch);
                }
                else if (data.type === 'close_modal') {
                    closeModal(data.changeTurn);
                }
            });
        }

        // --- LÓGICA DEL JUEGO ---

        function startGameAsHost() {
            // Host crea el mazo y lo envía para que ambos tengan el mismo orden
            deck = [];
            equations.forEach(eq => {
                deck.push({ id: eq.id, type: 'left', tex: `\\[ ${eq.left} \\]` });
                deck.push({ id: eq.id, type: 'right', tex: `\\[ ${eq.right} \\]` });
            });
            deck.sort(() => Math.random() - 0.5);

            conn.send({ type: 'init_game', deck: deck, hostName: myName });
            initGameUI();
        }

        function initGameUI() {
            showScreen('game-screen');
            updateScoreboard();
            
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            deck.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.index = index;
                cardEl.dataset.id = card.id;
                cardEl.dataset.type = card.type;
                
                cardEl.innerHTML = `
                    <div class="card-face card-front">${index + 1}</div>
                    <div class="card-face card-back">${card.tex}</div>
                `;
                
                // Click local
                cardEl.addEventListener('click', () => {
                    const isMyTurn = (isHost && currentTurn === 0) || (!isHost && currentTurn === 1);
                    if (isMyTurn && !lockBoard && !cardEl.classList.contains('flipped') && !cardEl.classList.contains('matched')) {
                        conn.send({ type: 'flip_card', index: index });
                        processCardFlip(cardEl, true);
                    }
                });
                grid.appendChild(cardEl);
            });

            MathJax.typesetPromise();
        }

        function processCardFlip(card, isLocalClick) {
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                setTimeout(showZoomModal, 600);
            }
        }

        function showZoomModal() {
            lockBoard = true;
            let card1 = flippedCards[0];
            let card2 = flippedCards[1];

            const modal = document.getElementById('zoom-modal');
            const mc1 = document.getElementById('modal-card-1');
            const mc2 = document.getElementById('modal-card-2');
            const modalResult = document.getElementById('modal-result');
            const modalBtn = document.getElementById('modal-btn');

            mc1.innerHTML = card1.querySelector('.card-back').innerHTML;
            mc2.innerHTML = card2.querySelector('.card-back').innerHTML;

            const isMyTurn = (isHost && currentTurn === 0) || (!isHost && currentTurn === 1);
            const activeName = currentTurn === 0 ? (isHost ? myName : opponentName) : (isHost ? opponentName : myName);

            if (isMyTurn) {
                modalResult.innerText = '¿Son equivalentes?';
                modalResult.style.color = 'var(--text)';
                modalBtn.style.display = 'inline-block';
                modalBtn.innerText = 'Verificar';
                modalBtn.style.backgroundColor = 'var(--secondary)';
                
                modalBtn.onclick = function() {
                    if (modalBtn.innerText === 'Verificar') {
                        let id1 = parseInt(card1.dataset.id);
                        let id2 = parseInt(card2.dataset.id);
                        let t1 = card1.dataset.type;
                        let t2 = card2.dataset.type;
                        
                        let isMatch = (id1 === id2 && t1 !== t2);
                        // Regla especial para los que valen "1"
                        const onesIds = [0, 10, 11];
                        if (!isMatch && onesIds.includes(id1) && onesIds.includes(id2) && t1 !== t2) {
                            isMatch = true;
                        }

                        conn.send({ type: 'resolve_modal', isMatch: isMatch });
                        resolveModalResult(isMatch);
                    } else {
                        // Clic en continuar
                        const changeTurn = !(modalResult.innerText.includes('Correcto'));
                        conn.send({ type: 'close_modal', changeTurn: changeTurn });
                        closeModal(changeTurn);
                    }
                };
            } else {
                modalResult.innerText = `Esperando a que ${activeName} verifique...`;
                modalResult.style.color = 'var(--text)';
                modalBtn.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        function resolveModalResult(isMatch) {
            const modalResult = document.getElementById('modal-result');
            const modalBtn = document.getElementById('modal-btn');
            
            if (isMatch) {
                modalResult.innerText = '¡Correcto! Es una pareja.';
                modalResult.style.color = 'var(--success)';
                modalBtn.style.backgroundColor = 'var(--success)';
            } else {
                modalResult.innerText = 'Incorrecto. No coinciden.';
                modalResult.style.color = 'var(--error)';
                modalBtn.style.backgroundColor = 'var(--error)';
            }
            modalBtn.innerText = 'Continuar';
        }

        function closeModal(changeTurn) {
            document.getElementById('zoom-modal').style.display = 'none';
            
            if (!changeTurn) { // Si acertaron
                flippedCards[0].classList.add('matched');
                flippedCards[1].classList.add('matched');
                scores[currentTurn]++;
                matchedPairs++;
            } else { // Si fallaron
                flippedCards[0].classList.remove('flipped');
                flippedCards[1].classList.remove('flipped');
            }

            flippedCards = [];
            lockBoard = false;
            
            if (changeTurn) {
                currentTurn = currentTurn === 0 ? 1 : 0;
            }
            
            updateScoreboard();

            if (matchedPairs === 16) {
                setTimeout(declareWinner, 500);
            }
        }

        function updateScoreboard() {
            const hostNameDisplay = isHost ? myName : opponentName;
            const guestNameDisplay = isHost ? opponentName : myName;

            const s1 = document.getElementById('score-team1');
            const s2 = document.getElementById('score-team2');
            const indicator = document.getElementById('turn-indicator');

            s1.innerText = `${hostNameDisplay}: ${scores[0]}`;
            s2.innerText = `${guestNameDisplay}: ${scores[1]}`;

            if (currentTurn === 0) {
                s1.classList.add('team-active');
                s2.classList.remove('team-active');
                indicator.innerText = `Turno de: ${hostNameDisplay}`;
            } else {
                s2.classList.add('team-active');
                s1.classList.remove('team-active');
                indicator.innerText = `Turno de: ${guestNameDisplay}`;
            }
        }

        function declareWinner() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('winner-screen').style.display = 'block';
            
            const hostNameDisplay = isHost ? myName : opponentName;
            const guestNameDisplay = isHost ? opponentName : myName;
            
            let winText = "";
            if (scores[0] > scores[1]) {
                winText = `¡${hostNameDisplay} Gana con ${scores[0]} puntos!`;
            } else if (scores[1] > scores[0]) {
                winText = `¡${guestNameDisplay} Gana con ${scores[1]} puntos!`;
            } else {
                winText = `¡Es un empate a ${scores[0]} puntos!`;
            }
            
            document.getElementById('winner-text').innerText = winText;
        }
    </script>
</body>
</html>
