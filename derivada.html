<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación de la Derivada con Límite</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px 40px 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 800px;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }
        .math-box {
            background-color: #fdfbf7;
            border-left: 5px solid #f39c12;
            padding: 15px;
            margin-top: 25px;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }
        .limit-display {
            font-size: 1.1em;
            margin-top: 10px;
            text-align: center;
        }
        .highlight-h {
            font-weight: bold;
            color: #2980b9;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Visualización Geométrica del Límite</h2>
        <p>Observa cómo la secante se vuelve tangente al acercar el incremento <strong>h</strong> a cero.</p>
        
        <canvas id="derivadaCanvas" width="750" height="450"></canvas>

        <div class="math-box">
            <p style="margin-top: 0; color: #7f8c8d; font-weight: bold;">Definición formal de la derivada:</p>
            <div>
                $$ f'(x_0) = \lim_{h \to 0} \frac{f(x_0+h) - f(x_0)}{h} $$
            </div>
            <div class="limit-display">
                Valor actual del incremento \( h \) \(\approx\) <span id="hValue" class="highlight-h">3.000</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('derivadaCanvas');
        const ctx = canvas.getContext('2d');
        const hDisplay = document.getElementById('hValue');

        // Configuraciones de escala (ajustadas para dar espacio a las etiquetas)
        const scaleX = 90;
        const scaleY = 35;
        const offsetX = 80;  // Más margen izquierdo para f(x0)
        const offsetY = 400; // Margen inferior para x0

        // Función f(x) = 0.3 * x^2 + 1
        function f(x) {
            return 0.3 * x * x + 1;
        }

        // Conversión a píxeles
        function cx(x) { return offsetX + x * scaleX; }
        function cy(y) { return offsetY - y * scaleY; }

        // Punto base (x0)
        const x0 = 1.8;
        const y0 = f(x0);

        // Variables de animación (usamos 'h' en lugar de 'dx' para coincidir con la fórmula)
        let h = 3.5;       
        let speed = 0.015;  

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar los ejes X e Y
            ctx.beginPath();
            ctx.moveTo(offsetX, 0); ctx.lineTo(offsetX, canvas.height);
            ctx.moveTo(0, offsetY); ctx.lineTo(canvas.width, offsetY);
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Etiquetas de los ejes
            ctx.fillStyle = "#7f8c8d";
            ctx.font = "italic 16px Arial";
            ctx.fillText("x", canvas.width - 20, offsetY - 10);
            ctx.fillText("y", offsetX + 10, 20);

            // 2. Dibujar la curva f(x)
            ctx.beginPath();
            for (let x = 0; x <= 6.5; x += 0.1) {
                if (x === 0) ctx.moveTo(cx(x), cy(f(x)));
                else ctx.lineTo(cx(x), cy(f(x)));
            }
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 3. Coordenadas del Punto desplazado (x0 + h)
            let x1 = x0 + h;
            let y1 = f(x1);

            // 4. Proyecciones hacia los ejes (líneas punteadas)
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1;

            // Proyecciones de x0 y f(x0)
            ctx.beginPath();
            ctx.moveTo(cx(x0), cy(y0)); ctx.lineTo(cx(x0), cy(0)); // hacia X
            ctx.moveTo(cx(x0), cy(y0)); ctx.lineTo(cx(0), cy(y0)); // hacia Y
            ctx.strokeStyle = '#c0392b'; // Rojo
            ctx.stroke();

            ctx.fillStyle = '#c0392b';
            ctx.font = "bold 14px Arial";
            ctx.fillText("x₀", cx(x0) - 8, cy(0) + 20);
            ctx.fillText("f(x₀)", cx(0) - 40, cy(y0) + 5);

            // Proyecciones de x0+h y f(x0+h)
            if (h >= 0.05) {
                ctx.beginPath();
                ctx.moveTo(cx(x1), cy(y1)); ctx.lineTo(cx(x1), cy(0)); // hacia X
                ctx.moveTo(cx(x1), cy(y1)); ctx.lineTo(cx(0), cy(y1)); // hacia Y
                ctx.strokeStyle = '#2980b9'; // Azul
                ctx.stroke();

                ctx.fillStyle = '#2980b9';
                ctx.fillText("x₀ + h", cx(x1) - 20, cy(0) + 20);
                ctx.fillText("f(x₀ + h)", cx(0) - 65, cy(y1) + 5);
            }
            ctx.setLineDash([]); // Restablecer línea continua

            // 5. Calcular y dibujar la recta (Secante o Tangente)
            let m = (y1 - y0) / (h); 
            let startX = 0;
            let startY = y0 - m * (x0 - startX);
            let endX = 7;
            let endY = y0 + m * (endX - x0);

            ctx.beginPath();
            ctx.moveTo(cx(startX), cy(startY));
            ctx.lineTo(cx(endX), cy(endY));
            
            if (h < 0.05) {
                ctx.strokeStyle = '#e74c3c'; // Rojo (Tangente)
                ctx.lineWidth = 3;
            } else {
                ctx.strokeStyle = '#3498db'; // Azul (Secante)
                ctx.lineWidth = 2;
            }
            ctx.stroke();

            // 6. Dibujar los Puntos
            // Punto fijo (x0, f(x0))
            ctx.beginPath();
            ctx.arc(cx(x0), cy(y0), 6, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();

            // Punto móvil (x0+h, f(x0+h))
            if (h >= 0.05) {
                ctx.beginPath();
                ctx.arc(cx(x1), cy(y1), 6, 0, Math.PI * 2);
                ctx.fillStyle = '#3498db';
                ctx.fill();
            }

            // Actualizar texto de 'h' en pantalla
            hDisplay.innerText = Math.max(0, h).toFixed(3);
            if (h < 0.05) {
                hDisplay.style.color = '#e74c3c';
                hDisplay.innerText = "0.000 (Límite alcanzado)";
            } else {
                hDisplay.style.color = '#2980b9';
            }

            // 7. Lógica de reducción de h
            h -= speed;

            if (h <= 0) {
                h = 0;
                setTimeout(() => {
                    h = 3.5; 
                    requestAnimationFrame(animar);
                }, 2000); // Pausar 2 segundos para apreciar la tangente
            } else {
                requestAnimationFrame(animar);
            }
        }

        // Iniciar
        animar();
    </script>
</body>
</html>
