<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Derivada: Animación Interactiva</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        .explanation {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555;
        }
        canvas {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background: #ffffff;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        .controls {
            background: #f1f3f5;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }
        input[type=range] {
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            margin: 15px 0;
        }
        .math-box {
            font-family: 'Courier New', Courier, monospace;
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            color: #1565c0;
            margin-top: 15px;
            border: 1px solid #90caf9;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .legend span.p { color: #e74c3c; }
        .legend span.q { color: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h1>El Límite de la Secante</h1>
    <p class="explanation">
        Mueve el control deslizante para cambiar el valor de <strong>h</strong>. 
        Observa cómo el punto Q se acerca al punto P. Cuando <strong>h tiende a 0</strong>, 
        la recta secante (naranja) se transforma en la recta tangente exacta (verde).
    </p>

    <div class="legend">
        <span class="p">● Punto P (Fijo en x)</span>
        <span class="q">● Punto Q (Móvil en x+h)</span>
    </div>

    <canvas id="graphCanvas" width="600" height="400"></canvas>

    <div class="controls">
        <label for="h-slider" style="font-size: 1.2em; font-weight: bold;">
            Distancia h: <span id="h-value" style="color: #e67e22;">2.000</span>
        </label><br>
        <input type="range" id="h-slider" min="0.001" max="3" step="0.01" value="2">
        
        <div class="math-box" id="math-output">
            Calculando límite...
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('h-slider');
    const hValueDisplay = document.getElementById('h-value');
    const mathOutput = document.getElementById('math-output');

    // Configuración del plano cartesiano
    const originX = 50;
    const originY = 350;
    const scaleX = 90;
    const scaleY = 30;

    // Función a derivar: f(x) = x^2 / 2
    function f(x) { return (x * x) / 2; }
    
    // Punto P fijo
    const x = 2; 

    function draw() {
        const h = parseFloat(slider.value);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Dibujar Ejes
        ctx.beginPath();
        ctx.moveTo(originX, 10); ctx.lineTo(originX, canvas.height - 10); // Eje Y
        ctx.moveTo(10, originY); ctx.lineTo(canvas.width - 10, originY); // Eje X
        ctx.strokeStyle = '#ced4da'; 
        ctx.lineWidth = 2; 
        ctx.stroke();

        // 2. Dibujar la curva f(x)
        ctx.beginPath();
        for (let i = 0; i <= 6; i += 0.1) {
            let px = originX + i * scaleX;
            let py = originY - f(i) * scaleY;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = '#343a40'; 
        ctx.lineWidth = 3; 
        ctx.stroke();

        // 3. Calcular coordenadas de P(x) y Q(x+h)
        const y = f(x);
        const qx = x + h;
        const qy = f(qx);

        const cxP = originX + x * scaleX;
        const cyP = originY - y * scaleY;
        const cxQ = originX + qx * scaleX;
        const cyQ = originY - qy * scaleY;

        // 4. Dibujar Recta Secante / Tangente
        const m = (qy - y) / h; // Pendiente Δy/Δx
        
        ctx.beginPath();
        // Extender la línea a lo largo del canvas usando la ecuación y - y1 = m(x - x1)
        const startX = -1; const startY = m * (startX - x) + y;
        const endX = 6;   const endY = m * (endX - x) + y;
        
        ctx.moveTo(originX + startX * scaleX, originY - startY * scaleY);
        ctx.lineTo(originX + endX * scaleX, originY - endY * scaleY);
        
        if (h < 0.05) {
            ctx.strokeStyle = '#2ecc71'; // Verde si es prácticamente tangente
            ctx.lineWidth = 3;
        } else {
            ctx.strokeStyle = '#f39c12'; // Naranja si es secante
            ctx.lineWidth = 2;
        }
        ctx.stroke();

        // 5. Dibujar Puntos
        // Punto Q
        ctx.beginPath(); ctx.arc(cxQ, cyQ, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#3498db'; ctx.fill();
        // Punto P
        ctx.beginPath(); ctx.arc(cxP, cyP, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c'; ctx.fill();

        // 6. Actualizar Textos y Fórmulas
        hValueDisplay.innerText = h.toFixed(3);
        
        let term1 = `f(${x} + ${h.toFixed(2)})`;
        let term2 = `f(${x})`;
        mathOutput.innerHTML = `m = [ ${term1} - ${term2} ] / ${h.toFixed(2)} = ${m.toFixed(3)}`;
    }

    // Escuchar cambios en el deslizador
    slider.addEventListener('input', draw);
    
    // Dibujar estado inicial
    draw();
</script>

</body>
</html>
